<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    
    <style>
        body{
            background-color: #f2f2f2;
            
    }
    
form{
            padding: 50px;
            width: 500px;
            height: 750px;
            border:1px solid black;
            border-radius: 10px;
            margin: 30px auto;
            box-shadow: 0px 20px 60px rgba(0,0,0,0.3);
        }
        h1{
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        input:not([type="radio"]):not([type="checkbox"]),select{
            border: 2px solid white;
            border-radius: 2px;
            width: 100%;
            padding: 5px;
            box-shadow: 0px 8px 10px rgba(0,0,0,0.3);;
        }

        .form-container{
            width: 500px;
            
        }
        .box{
            width: 100%;
            padding: 5px;
            box-shadow: 0px 8px 10px rgba(0,0,0,0.3)
        }
        .Reset{
            background-color:blue ;
            color: white;
        }

        .Submit{
            background-color: red;
            color: white;
        }
    </style>
    
</head>
<body>
    <h1>Student Registration Portal</h1>

    <form action = "/register" method="post">
        <label for="full_name">Full name:</label>
        <input type="text" id="full_name" name="full_name" placeholder="enter name.." required>
        <br>  <br>

        <label for="number">Phone Number:</label>
        <input type="number" id="number" name="number" placeholder="Enter number..." required>
        <br>  <br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password..." required>
        <br>  <br>

        <label for="email">University Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email..." required>
        <br>  <br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age..." required>
        <br>  <br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br>  <br>


        <label for="gender">Gender:</label>
        <input type="radio" value="male" name = "gender" id = "male">
        <label for="male">Male</label>
        <input type="radio" value="female" name = "gender" id = "female">
        <label for="female">Female</label>
        <input type="radio" value="other" name = "gender" id = "other">
        <label for="other">Other</label>
        <br>  <br>

        <label for="Courses">Courses:</label>
        <select type="dropdown" name="Course" id="Courses" required>
            <option value="BTECH">B.Tech</option>
            <option value="MBA">MBA</option>
            <option value="BCA">B.C.A</option>
        </select>

        <br> <br>

        <label for="skills">Skills:</label>
        <input type="checkbox" value="python" name = "skills" id = "python">
        <label for="python">Python</label>
        <input type="checkbox" value="java" name = "skills" id = "java"> 
        <label for="java">Java</label>
        <input type="checkbox" value="c++" name = "skills" id = "c++">
        <label for="C++">C++</label>
        <br> <br>

        <label for="Internship">Internship Preference:</label>
        <input type="radio" value="Delhi" name="delhi" id="delhi">
        <label for="delhi">Delhi</label>
        <input type="radio" value="Mumbai" name="mumbai" id="mumbai">
        <label for="mumbai">Mumbai</label>
        <input type="radio" value="Bangalore" name="bangalore" id="bangalore">
        <label for="bangalore">Bangalore</label>
        <br> <br>

        <label for="Cover">Any Comments:</label>
        <textarea id="Cover" name="Cover" placeholder="Enter any comments..." required></textarea>
        <br> <br>

        <label for="Resume">Upload Resume:</label>
        <input type="file" name="resume" accept=".pdf,.doc,.docx" required>

        <br> <br>
        <button class="Reset" type="Reset">Reset</button>
        <button class="Submit" type="Submit">Submit</button>
        
        

    </form>

</body>
</html>
